{% extends "base.html" %}

{% block title %}Action Logs - PiBlindHub{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h3 mb-0">Action Logs</h1>
                <div class="btn-group" role="group">
                    <button type="button" class="btn btn-outline-primary" onclick="refreshLogs()">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button>
                    <button type="button" class="btn btn-outline-secondary" onclick="exportLogs()">
                        <i class="fas fa-download"></i> Export
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Statistics Cards -->
    <div class="row mb-4">
        <div class="col-md-3">
            <div class="card bg-primary text-white">
                <div class="card-body">
                    <div class="d-flex justify-content-between">
                        <div>
                            <h4 class="card-title" id="total-actions">0</h4>
                            <p class="card-text">Total Actions</p>
                        </div>
                        <div class="align-self-center">
                            <i class="fas fa-list fa-2x"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-success text-white">
                <div class="card-body">
                    <div class="d-flex justify-content-between">
                        <div>
                            <h4 class="card-title" id="successful-actions">0</h4>
                            <p class="card-text">Successful</p>
                        </div>
                        <div class="align-self-center">
                            <i class="fas fa-check-circle fa-2x"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-danger text-white">
                <div class="card-body">
                    <div class="d-flex justify-content-between">
                        <div>
                            <h4 class="card-title" id="failed-actions">0</h4>
                            <p class="card-text">Failed</p>
                        </div>
                        <div class="align-self-center">
                            <i class="fas fa-times-circle fa-2x"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-info text-white">
                <div class="card-body">
                    <div class="d-flex justify-content-between">
                        <div>
                            <h4 class="card-title" id="recent-actions">0</h4>
                            <p class="card-text">Recent</p>
                        </div>
                        <div class="align-self-center">
                            <i class="fas fa-clock fa-2x"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Filters -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title mb-0">Filters</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-3">
                            <label for="action-type-filter" class="form-label">Action Type</label>
                            <select class="form-select" id="action-type-filter">
                                <option value="">All Types</option>
                                <option value="user_login">User Login</option>
                                <option value="user_logout">User Logout</option>
                                <option value="password_change">Password Change</option>
                                <option value="device_open">Device Open</option>
                                <option value="device_close">Device Close</option>
                                <option value="device_stop">Device Stop</option>
                                <option value="network_config_update">Network Config</option>
                                <option value="hotspot_start">Hotspot Start</option>
                                <option value="hotspot_stop">Hotspot Stop</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="status-filter" class="form-label">Status</label>
                            <select class="form-select" id="status-filter">
                                <option value="">All Status</option>
                                <option value="success">Success</option>
                                <option value="failed">Failed</option>
                                <option value="pending">Pending</option>
                                <option value="in_progress">In Progress</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="user-filter" class="form-label">User</label>
                            <input type="text" class="form-control" id="user-filter" placeholder="User ID">
                        </div>
                        <div class="col-md-3">
                            <label for="device-filter" class="form-label">Device</label>
                            <input type="text" class="form-control" id="device-filter" placeholder="Device ID">
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-12">
                            <button type="button" class="btn btn-primary" onclick="applyFilters()">
                                <i class="fas fa-filter"></i> Apply Filters
                            </button>
                            <button type="button" class="btn btn-outline-secondary" onclick="clearFilters()">
                                <i class="fas fa-times"></i> Clear
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Action Logs Table -->
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title mb-0">Action Logs</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover" id="action-logs-table">
                            <thead class="table-dark">
                                <tr>
                                    <th>Timestamp</th>
                                    <th>Action Type</th>
                                    <th>Description</th>
                                    <th>User</th>
                                    <th>Device</th>
                                    <th>Status</th>
                                    <th>Duration</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="action-logs-tbody">
                                <tr>
                                    <td colspan="8" class="text-center">
                                        <div class="spinner-border" role="status">
                                            <span class="visually-hidden">Loading...</span>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let currentLogs = [];

function formatTimestamp(timestamp) {
    if (!timestamp) return 'N/A';
    const date = new Date(timestamp);
    return date.toLocaleString();
}

function formatDuration(duration) {
    if (!duration) return 'N/A';
    return duration + 'ms';
}

function getStatusBadge(status) {
    const statusMap = {
        'success': 'success',
        'failed': 'danger',
        'pending': 'warning',
        'in_progress': 'info'
    };
    const badgeClass = statusMap[status] || 'secondary';
    return `<span class="badge bg-${badgeClass}">${status}</span>`;
}

function getActionTypeBadge(actionType) {
    const typeMap = {
        'user_login': 'primary',
        'user_logout': 'secondary',
        'password_change': 'warning',
        'device_open': 'success',
        'device_close': 'danger',
        'device_stop': 'warning',
        'network_config_update': 'info',
        'hotspot_start': 'success',
        'hotspot_stop': 'danger'
    };
    const badgeClass = typeMap[actionType] || 'secondary';
    return `<span class="badge bg-${badgeClass}">${actionType}</span>`;
}

function renderLogs(logs) {
    const tbody = document.getElementById('action-logs-tbody');
    
    if (logs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center">No action logs found</td></tr>';
        return;
    }
    
    tbody.innerHTML = logs.map(log => `
        <tr>
            <td>${formatTimestamp(log.timestamp)}</td>
            <td>${getActionTypeBadge(log.action_type)}</td>
            <td>${log.description || 'N/A'}</td>
            <td>${log.user_id || 'N/A'}</td>
            <td>${log.device_id || 'N/A'}</td>
            <td>${getStatusBadge(log.status)}</td>
            <td>${formatDuration(log.duration_ms)}</td>
            <td>
                <button class="btn btn-sm btn-outline-primary" onclick="viewLogDetails('${log.id}')">
                    <i class="fas fa-eye"></i>
                </button>
            </td>
        </tr>
    `).join('');
}

function updateStatistics(statistics) {
    document.getElementById('total-actions').textContent = statistics.total_actions || 0;
    document.getElementById('successful-actions').textContent = statistics.by_status?.success || 0;
    document.getElementById('failed-actions').textContent = statistics.by_status?.failed || 0;
    document.getElementById('recent-actions').textContent = statistics.recent_actions || 0;
}

async function loadActionLogs() {
    try {
        const response = await fetch('/api/action-logs?limit=100');
        if (!response.ok) {
            throw new Error('Failed to load action logs');
        }
        
        const data = await response.json();
        currentLogs = data.actions || [];
        renderLogs(currentLogs);
        updateStatistics(data.statistics || {});
        
    } catch (error) {
        console.error('Error loading action logs:', error);
        document.getElementById('action-logs-tbody').innerHTML = 
            '<tr><td colspan="8" class="text-center text-danger">Error loading action logs</td></tr>';
    }
}

function applyFilters() {
    const actionType = document.getElementById('action-type-filter').value;
    const status = document.getElementById('status-filter').value;
    const user = document.getElementById('user-filter').value;
    const device = document.getElementById('device-filter').value;
    
    let filteredLogs = currentLogs;
    
    if (actionType) {
        filteredLogs = filteredLogs.filter(log => log.action_type === actionType);
    }
    
    if (status) {
        filteredLogs = filteredLogs.filter(log => log.status === status);
    }
    
    if (user) {
        filteredLogs = filteredLogs.filter(log => 
            log.user_id && log.user_id.toLowerCase().includes(user.toLowerCase())
        );
    }
    
    if (device) {
        filteredLogs = filteredLogs.filter(log => 
            log.device_id && log.device_id.toLowerCase().includes(device.toLowerCase())
        );
    }
    
    renderLogs(filteredLogs);
}

function clearFilters() {
    document.getElementById('action-type-filter').value = '';
    document.getElementById('status-filter').value = '';
    document.getElementById('user-filter').value = '';
    document.getElementById('device-filter').value = '';
    renderLogs(currentLogs);
}

function refreshLogs() {
    loadActionLogs();
}

function exportLogs() {
    const dataStr = JSON.stringify(currentLogs, null, 2);
    const dataBlob = new Blob([dataStr], {type: 'application/json'});
    const url = URL.createObjectURL(dataBlob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `action_logs_${new Date().toISOString().split('T')[0]}.json`;
    link.click();
    URL.revokeObjectURL(url);
}

function viewLogDetails(logId) {
    const log = currentLogs.find(l => l.id === logId);
    if (log) {
        const details = JSON.stringify(log, null, 2);
        alert(details);
    }
}

// Load logs on page load
document.addEventListener('DOMContentLoaded', function() {
    loadActionLogs();
    
    // Auto-refresh every 30 seconds
    setInterval(loadActionLogs, 30000);
});
</script>
{% endblock %}
