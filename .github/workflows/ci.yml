name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,mqtt]'
      - run: ruff check .
      - run: ruff format --check .
      - if: matrix.python-version == '3.9'
        run: mypy
      - run: pytest --cov=piblindhub --cov-report=term-missing --cov-fail-under=80
      - run: python -m compileall -q src tests
      - run: node --check src/piblindhub/web/static/app.js
      - run: python -m build
